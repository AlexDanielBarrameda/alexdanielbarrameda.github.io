name: Deploy Vite Portfolio to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch: # lets you re-run a deploy from the Actions tab without a new commit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

# Build and deploy are separate jobs on purpose. When deploy-pages runs in the same job,
# right after the upload, its artifact lookup can come back empty and fail with
# 'No artifacts named "github-pages"' (actions/deploy-pages#451). Starting a second job
# gives the upload time to be listed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
